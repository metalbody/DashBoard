<!DOCTYPE html>
<html>

<head>

  <title>Environment Sensors</title>

  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="/socket.io/socket.io.js"></script>


</head>

<body>

<div class="env-grid">

  <div class="env-chart-card">
    <h2>Temperature</h2>
    <canvas id="tempChart"></canvas>
  </div>

  <div class="env-chart-card">
    <h2>Humidity</h2>
    <canvas id="humChart"></canvas>
  </div>

  <div class="env-chart-card env-bottom-chart">
    <h2>Pressure</h2>
    <canvas id="pressChart"></canvas>
  </div>

</div>

<script>

const socket = io();

const maxPoints = 100;

// ================= TEMPERATURE =================

const tempChart = new Chart(
  document.getElementById('tempChart'),
  {
    type: 'line',
    data: {
      labels: [],
      datasets: [
        {
          label: 'Temperature (°C)',
          data: []
        }
      ]
    },
    options: {
      responsive: true,
      animation: false
    }
  }
);

// ================= HUMIDITY =================

const humChart = new Chart(
  document.getElementById('humChart'),
  {
    type: 'line',
    data: {
      labels: [],
      datasets: [
        {
          label: 'Humidity (%)',
          data: []
        }
      ]
    },
    options: {
      responsive: true,
      animation: false
    }
  }
);

// ================= PRESSURE =================

const pressChart = new Chart(
  document.getElementById('pressChart'),
  {
    type: 'line',
    data: {
      labels: [],
      datasets: [
        {
          label: 'Pressure (kPa)',
          data: []
        }
      ]
    },
    options: {
      responsive: true,
      animation: false
    }
  }
);

function updateChart(chart, value) {

  if (chart.data.labels.length > maxPoints) {
    chart.data.labels.shift();
    chart.data.datasets[0].data.shift();
  }

  chart.data.labels.push('');
  chart.data.datasets[0].data.push(value);

  chart.update();
}

socket.on('sensorData', (data) => {

  if (data.TEMP !== undefined)
    updateChart(tempChart, data.TEMP);

  if (data.HUM !== undefined)
    updateChart(humChart, data.HUM);

  if (data.PRESS !== undefined)
    updateChart(pressChart, data.PRESS);

});

</script>

</body>
</html>
